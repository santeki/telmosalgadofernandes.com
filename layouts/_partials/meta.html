<p class="meta">
  {{- if eq .Section "drafts" }}<span class="badge">Draft</span>{{ end -}}
  {{- $c := .Params.category }}
  {{- range where site.Params.categories "key" $c }}<span class="kind">{{ .one }}</span> · {{ end -}}
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
</p>
